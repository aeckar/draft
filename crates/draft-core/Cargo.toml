[package]
name = "draft-core"
version = "0.1.0"
edition = "2024"
authors = ["Angel Eckardt <eckardt.angel7@outlook.com>"]
license = "AGPL-3.0-only"                                # disallow competitors until launch
homepage = "https://github.com/aeckar/draft"
repository = "https://github.com/aeckar/draft"

[dependencies]
thiserror = "2.0.18"
pastey = "0.2.3"
indoc = "2.0.7"
bitflags = "2.12.1"
derive_more = { version = "2.1.1", features = ["from", "deref", "display"] }
typeof-literal = "1.0.0"

## Lexical analysis & AST construction

# zero-copy, non-linear parsing over slices of bytes and tokens
taped = "1.5.2"

## Lexical analysis

# vectorized UTF-8 validation of source files
simdutf8 = "0.1.5"

# convert `TokenKind` entries to token numerals
strum = { version = "0.28.0", optional = true, features = ["derive"] }

## AST traversal

# validate probable hyperlinks
linkify = "0.11.0"

# compile to HTML
mime_guess = { version = "2.0.5", optional = true }
video-url-validator = { version = "0.1.0", optional = true }
html-escape = { version = "0.2.13", optional = true }

# runtime execution of user-defined JavaScript macros
boa_engine = { version = "0.21.0", optional = true }

# conversion from Markdown (`migrate` command)
pulldown-cmark = { version = "0.13.4", optional = true }

# table conversions from CSV via `table` macro
csv = { version = "1.4.0", optional = true }

[features]
default = ["full"] # todo change to "parse-markup" after implementation 
full = [
    "parse-markup",
    "formatter",
    "to-html",
    "to-markdown",
    "from-markdown",
    "macros",
]

parse-markup = ["dep:strum"]
formatter = []
to-html = [
    "parse-markup",
    "macros",
    "dep:html-escape",
    "dep:mime_guess",
    "dep:video-url-validator",
]
to-markdown = ["macros", "parse-markup"]
from-markdown = ["parse-markup", "dep:pulldown-cmark"]
macros = ["dep:boa_engine", "dep:csv"]

[lib]
path = "src/lib.rs"
